version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:80
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://civicfix:civicfix_secret@postgres:5432/civicfix_db
      - LIMITS_REDIS_URL=redis://redis-limits:6379/0
      - QUEUE_REDIS_URL=redis://redis-queue:6379/0
      - CACHE_REDIS_URL=redis://redis-limits:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=civicfix-reports
      - MINIO_SECURE=False
      - RESEND_API_KEY=your_resend_api_key_here
      - EMAIL_FROM=notifications@civicfix.gov
    depends_on:
      - postgres
      - redis-limits
      - redis-queue
      - minio
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://civicfix:civicfix_secret@postgres:5432/civicfix_db
      - LIMITS_REDIS_URL=redis://redis-limits:6379/0
      - QUEUE_REDIS_URL=redis://redis-queue:6379/0
      - WORKER_CONCURRENCY=10
      - GEMINI_MAX_CONCURRENCY=4
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - RESEND_API_KEY=your_resend_api_key_here
      - EMAIL_FROM=notifications@civicfix.gov
    depends_on:
      - api
      - redis-queue
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: unless-stopped

  postgres:
    image: postgis/postgis:15-3.3-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=civicfix
      - POSTGRES_PASSWORD=civicfix_secret
      - POSTGRES_DB=civicfix_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Dedicated Redis for Rate Limiting & Micro-cache (Eviction Policy: allkeys-lru)
  redis-limits:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    restart: unless-stopped

  # Dedicated Redis for Durable ARQ Task Queue (Eviction Policy: strictly noeviction)
  redis-queue:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
