apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: civicfix-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/vpc-access-connector: projects/civicfix-prod/locations/us-central1/connectors/civicfix-vpc
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: gcr.io/civicfix-prod/civicfix-backend:latest
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: NEXT_PUBLIC_ASYNC_REPORTS
              value: "true"
            - name: LIMITS_REDIS_URL
              value: "redis://10.0.0.4:6379/0"
            - name: QUEUE_REDIS_URL
              value: "redis://10.0.0.5:6379/0"
            - name: CACHE_REDIS_URL
              value: "redis://10.0.0.4:6379/0"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: civicfix-db-primary
                  key: latest
            - name: DATABASE_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: civicfix-db-replica
                  key: latest
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: civicfix-supabase-secret
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: civicfix-gemini-key
                  key: latest
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
