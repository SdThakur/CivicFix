# CivicFix Nginx Production Micro-Cache & Gateway Configuration
# Reverse proxy routing for Next.js Frontend, FastAPI Backend, and Edge Micro-Caching

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time" '
                      'cache=$upstream_cache_status req_id=$http_x_request_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Nginx Micro-Cache Zone definition
    # 10MB keys zone holds ~80,000 keys; 1GB maximum size on disk; inactive pruned after 10m
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=microcache:10m max_size=1g inactive=10m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # Upstream Backend Pool
    upstream backend_api {
        server backend:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Upstream Frontend Pool
    upstream frontend_ui {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Client Max Upload Size for Incident Photos
        client_max_body_size 15M;

        # ─── 1. PUBLIC READ MICRO-CACHE ENDPOINTS (/public/ & /api/v1/public/) ────────
        location ~ ^/(public/|api/v1/public/) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Enable Micro-cache
            proxy_cache microcache;
            proxy_cache_valid 200 15s;
            proxy_cache_valid 404 10s;
            proxy_cache_valid any 1s;

            # Graceful stale handling under traffic surges
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Ignore backend Set-Cookie headers on public responses
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;

            # STRICT SECURITY RULE: NEVER cache anything with an Authorization header
            proxy_cache_bypass $http_authorization;
            proxy_no_cache $http_authorization;

            # Cache status header
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Served-By "CivicFix-Edge-Proxy" always;
        }

        # ─── 2. DYNAMIC BACKEND API ROUTES ───────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Dynamic mutations & private routes: never cached
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # ─── 3. HEALTH & METRICS ENDPOINTS ────────────────────────────────────────────
        location ~ ^/(health|metrics) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # ─── 4. FRONTEND NEXT.JS APPLICATION ─────────────────────────────────────────
        location / {
            proxy_pass http://frontend_ui;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

